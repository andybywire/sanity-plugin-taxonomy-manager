name: Release

# Continuous release on push to main, plus manual publish-on-demand.
# Publishing to npm uses OIDC trusted publishing (no NPM_TOKEN): the package must
# be configured as a trusted publisher on npmjs.com, pointing at this repo + the
# `release` workflow. If the bundled @semantic-release/npm doesn't support
# tokenless OIDC yet, fall back to an `NPM_TOKEN` secret + `env.NPM_TOKEN`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-install:
    # Its own job, not a step in `gate`: this is the only check that exercises a
    # real consumer dependency layout, so a failure means something categorically
    # different from a build failure and should read that way.
    name: Consumer install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # About dependency resolution, not the engines floor `gate` already pins.
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packs the plugin and npm-installs it into throwaway Studios, asserting a
      # single shared @sanity/ui and @sanity/icons. This is the check a plugin dev
      # Studio structurally cannot make: pnpm workspaces and Vite's dep-optimizer
      # both collapse a duplicate major into one copy, so the bug is invisible
      # locally while breaking real installs. See ADR 0004.
      - run: pnpm test:studio-install

  release:
    # A package that would break a real consumer install must not publish.
    needs: consumer-install
    runs-on: ubuntu-latest
    permissions:
      contents: write # create git tags, GitHub releases, and commit version + CHANGELOG
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Latest 22.x, NOT the >=22.12 engines floor: the next step installs npm@latest,
          # which requires node ^22.22.2. Pinning to the floor breaks the release job.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@latest # npm 11.5+ for OIDC trusted publishing
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
