name: CI

# The gate from CLAUDE.md, run on every PR and on main.
# Until this existed, `release.yml` ran `pnpm build` on main and nothing else —
# tests, typecheck and lint were enforced only by the local husky pre-commit hook.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Deliberately the exact engines floor, so CI proves the package really does
          # work at its declared minimum. Do not raise this to track latest.
          node-version: 22.12
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm lint
      # The studio is outside the gate (eslint-ignored, not in typecheck/build/test);
      # this is the headless integration check that the plugin still composes.
      - run: pnpm --filter studio build

  consumer-install:
    # Its own job, not a step in `gate`: this is the only check that exercises a
    # real consumer dependency layout, so a failure means something categorically
    # different from a build failure and should read that way.
    name: Consumer install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # About dependency resolution, not the engines floor `gate` already pins.
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packs the plugin and npm-installs it into throwaway Studios, asserting a
      # single shared @sanity/ui and @sanity/icons. This is the check a plugin dev
      # Studio structurally cannot make: pnpm workspaces and Vite's dep-optimizer
      # both collapse a duplicate major into one copy, so the bug is invisible
      # locally while breaking real installs. See ADR 0004.
      - run: pnpm test:studio-install
